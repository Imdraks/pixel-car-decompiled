name: Publish Windows release archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-windows-preview
    steps:
      - name: Download and verify staged Windows archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir staged
          cd staged
          gh release download "$RELEASE_TAG" --pattern 'PixelCarRacerPC-Windows-x64.zip.part-*'
          python3 - <<'PYTHON'
          from pathlib import Path
          parts = sorted(Path('.').glob('PixelCarRacerPC-Windows-x64.zip.part-*'))
          expected = [f'PixelCarRacerPC-Windows-x64.zip.part-{i:03d}' for i in range(36)]
          if [p.name for p in parts] != expected:
              raise SystemExit('Missing or unexpected archive parts')
          with Path('PixelCarRacerPC-Windows-x64.zip').open('wb') as out:
              for part in parts:
                  out.write(part.read_bytes())
          PYTHON
          echo 'a64198690fa2759197d45a3334d5e462f105eeb2f2ada02d9637d32ad3f70d2c  PixelCarRacerPC-Windows-x64.zip' > expected.sha256
          sha256sum --check expected.sha256
      - name: Upload complete archive and publish
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          gh release upload "$RELEASE_TAG" PixelCarRacerPC-Windows-x64.zip
          for part in PixelCarRacerPC-Windows-x64.zip.part-*; do
            gh release delete-asset "$RELEASE_TAG" "$part" --yes
          done
          gh release edit "$RELEASE_TAG" --draft=false
