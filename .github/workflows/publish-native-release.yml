          if ($p.ExitCode -ne 0) { throw 'Customization body render audit failed' }
          $report = Get-Content "$out/customization-audit.json" -Raw | ConvertFrom-Json
          if ($report.body_banks_checked -ne 382 -or $report.cosmetic_cases_checked -ne 280770 -or $report.full_body_renders -ne 1528 -or $report.generic_mounts_checked -ne 27122 -or $report.hood_cases_checked -ne 14898 -or $report.android_full_render_equivalence) { throw 'Customization rendering coverage differs' }
      - name: Collect Windows validation
