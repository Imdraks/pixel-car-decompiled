          $expected | ConvertTo-Json | Out-File validation/menu-music-routing.json
      - name: Verify rolling wheelspin and progressive steering captures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $spin=Get-Content validation/screens/physique-patinage.png.state -Raw | ConvertFrom-StringData
          if ($spin.screen -ne '2' -or $spin.player_tc -ne '0' -or [double]$spin.player_wheel_omega*[double]$spin.player_wheel_radius -le [double]$spin.player_speed_mps) { throw 'Rolling wheelspin does not match driven wheel speed' }
          $turn=Get-Content validation/screens/physique-virage.png.state -Raw | ConvertFrom-StringData
          if ($turn.screen -ne '2' -or $turn.player_tc -ne '1' -or [double]$turn.player_lane -le 1 -or [double]$turn.player_lane -ge 2 -or [double]$turn.player_lateral_speed -le 0) { throw 'Progressive steering capture failed' }
      - name: Verify menu backgrounds cover resized Windows windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $regions=Get-Content "$env:RUNNER_TEMP\pcr-native-app\cadrage-fonds.json" -Raw | ConvertFrom-Json
          if ($regions.frames.Count -ne 15) { throw 'Missing source backdrop region coverage' }
          $results=@{}
          foreach ($name in @('fond-menu-4x3','fond-menu-large')) {
            $im=[System.Drawing.Bitmap]::new((Join-Path $PWD "validation/screens/$name.png"))
            $native=$name -eq 'fond-menu-large';$bank='unbound';$tint=@(112,120,132);$alpha=89/255
            if ($native) { $bank='original';$tint=@(255,255,255);$alpha=0 }
            $region=$regions.frames | Where-Object { $_.bank -eq $bank -and $_.index -eq 0 }
            $originX=$region.atlas_rect.x+$region.content_rect.x;$originY=$region.atlas_rect.y+$region.content_rect.y;$sourceWidth=[int]$region.content_rect.width;$sourceHeight=[int]$region.content_rect.height
            $source=[System.Drawing.Bitmap]::new("$env:RUNNER_TEMP\pcr-native-app\assets\$($region.asset_file)")
            try {
              $points=@();$scale=[Math]::Max($im.Width/$sourceWidth,$im.Height/$sourceHeight)
              if ($im.Width/$im.Height -lt 16/9) {
                foreach ($y in @(8,($im.Height-9))) { for ($x=8; $x -lt $im.Width-8; $x+=4) { $points+=,@($x,$y) } }
              } else {
                foreach ($x in @(8,($im.Width-9))) { for ($y=8; $y -lt $im.Height-8; $y+=4) { $points+=,@($x,$y) } }
              }
              $matched=0;$nonblack=0
              foreach ($point in $points) {
                $x=$point[0];$y=$point[1];$c=$im.GetPixel($x,$y);$actual=@($c.R,$c.G,$c.B)
                if ([Math]::Max($c.R,[Math]::Max($c.G,$c.B)) -gt 2) { $nonblack++ }
                $sx=[int][Math]::Floor(($sourceWidth-$im.Width/$scale)/2+($x+.5)/$scale);$sy=[int][Math]::Floor(($sourceHeight-$im.Height/$scale)/2+($y+.5)/$scale);$best=1000
                foreach ($dy in @(-1,0,1)) { foreach ($dx in @(-1,0,1)) {
                  $c=$source.GetPixel($originX+[Math]::Clamp($sx+$dx,0,($sourceWidth-1)),$originY+[Math]::Clamp($sy+$dy,0,($sourceHeight-1)));$rgb=@($c.R,$c.G,$c.B);$ink=@(10,15,23);$channelError=0
                  for ($i=0;$i -lt 3;$i++) { $expected=$rgb[$i]*$tint[$i]/255*(1-$alpha)+$ink[$i]*$alpha;$channelError=[Math]::Max($channelError,[Math]::Abs($actual[$i]-$expected)) }
                  $best=[Math]::Min($best,$channelError)
                } }
                if ($best -le 4) { $matched++ }
              }
              if ($matched/$points.Count -le .99) { throw "Menu margins do not match the source background in $name" }
              if ($native -and $nonblack/$points.Count -le .6) { throw 'Baked black side gutters remain in the wide background' }
              $results[$name]=@{width=$im.Width;height=$im.Height;source_pixel_matches=$matched/$points.Count;nonblack_margin_fraction=$nonblack/$points.Count}
            } finally { $im.Dispose();$source.Dispose() }
          }
          $balanced=Get-Content validation/screens/reglage-wheelie-balanced.png.state -Raw | ConvertFrom-StringData
          if ($balanced.profile_wheelie_tune -ne '1' -or $balanced.vehicle_allows_wheelie -ne '0') { throw 'Balanced slider is not the authoritative wheelie control' }
          $results | ConvertTo-Json -Depth 3 | Out-File validation/menu-backgrounds.json
      - name: Audit customization on every source body and export contact sheets
