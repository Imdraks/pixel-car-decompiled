name: Validate and publish native Windows release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft native release tag
        required: true
        default: v0.16.5-native-preview
      archive_sha256:
        description: SHA-256 of the exact Windows ZIP
        required: true
      core_sha256:
        description: SHA-256 of the Windows core test executable
        required: true
      part_count:
        description: Number of staged 4 MiB archive parts
        required: true
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  EXPECTED_SHA: ${{ inputs.archive_sha256 }}
  CORE_SHA: ${{ inputs.core_sha256 }}
  PART_COUNT: ${{ inputs.part_count }}
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-native-preview$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CORE_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PART_COUNT" =~ ^[0-9]+$ ]]
          (( PART_COUNT >= 1 && PART_COUNT <= 64 ))
      - name: Assemble and verify the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          cd candidate
          gh release download "$RELEASE_TAG" --pattern 'PixelCarRacerNative-Windows-x64.zip.part-*'
          gh release download "$RELEASE_TAG" --pattern 'Core-Tests-Windows.exe'
          python3 - <<'PY'
          import os, hashlib
          from pathlib import Path
          names = [f'PixelCarRacerNative-Windows-x64.zip.part-{i:03d}' for i in range(int(os.environ['PART_COUNT']))]
          observed = sorted(p.name for p in Path('.').glob('*.part-*'))
          if names != observed: raise SystemExit('Unexpected or missing archive parts')
          with Path('PixelCarRacerNative-Windows-x64.zip').open('wb') as out:
              for name in names:
                  p = Path(name)
                  if p.stat().st_size > 4 * 1024 * 1024: raise SystemExit('Part size exceeds staging contract')
                  out.write(p.read_bytes())
          for name, variable in [('PixelCarRacerNative-Windows-x64.zip', 'EXPECTED_SHA'), ('Core-Tests-Windows.exe', 'CORE_SHA')]:
              if hashlib.file_digest(Path(name).open('rb'),'sha256').hexdigest() != os.environ[variable]:
                  raise SystemExit('Candidate digest mismatch: '+name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-candidate
          path: |
            candidate/PixelCarRacerNative-Windows-x64.zip
            candidate/Core-Tests-Windows.exe
          retention-days: 7
  windows:
    needs: assemble
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-candidate
          path: candidate
      - name: Validate the Windows executable and settings persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'candidate/PixelCarRacerNative-Windows-x64.zip'
          $core = Join-Path $PWD 'candidate/Core-Tests-Windows.exe'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:EXPECTED_SHA) { throw 'Archive digest mismatch' }
          if ((Get-FileHash $core -Algorithm SHA256).Hash.ToLower() -ne $env:CORE_SHA) { throw 'Test executable digest mismatch' }
          New-Item -ItemType Directory validation -Force | Out-Null
          & $core "$env:RUNNER_TEMP\pcr-native-core" *> validation/core-tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content validation/core-tests.txt; throw 'Windows core tests failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\exhaust-gearbox.json" validation/exhaust-gearbox.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\attachment-fit.json" validation/attachment-fit.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\customization-render.json" validation/customization-render.json
          $cosmetics = Get-Content validation/customization-render.json -Raw | ConvertFrom-Json
          if ($cosmetics.palette_shades_checked -ne 2376 -or $cosmetics.cosmetic_cases_checked -ne 280770 -or $cosmetics.hood_body_kit_pipe_cases -ne 14898 -or $cosmetics.rim_finish_recipes -ne 521 -or $cosmetics.hood_coordinates_recovered_from_android) { throw 'Customization source coverage differs' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\engine-audio-assignments.json" validation/engine-audio-assignments.json
          $engineAudio = Get-Content validation/engine-audio-assignments.json -Raw | ConvertFrom-Json
          if ($engineAudio.equipped_engine_bank_cases -ne 32 -or -not $engineAudio.source_sample_selection_verified -or $engineAudio.stock_selection_recovered) { throw 'Equipped engine audio selection failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\rev-launch.json" validation/rev-launch.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\driving-physics.csv" validation/driving-physics.csv
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\driving-physics.json" validation/driving-physics.json
          $driving = Get-Content validation/driving-physics.json -Raw | ConvertFrom-Json
          if ($driving.checks_passed -ne 24 -or $driving.vehicles_checked -ne 430 -or !$driving.independent_axle_abs -or $driving.full_android_dynamics_equivalence -or $driving.turning_distance_m -ge $driving.straight_distance_m) { throw 'Rolling spin, axle ABS or combined grip verification failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\rev-launch.csv" validation/rev-launch.csv
          $revLaunch = Get-Content validation/rev-launch.json -Raw | ConvertFrom-Json
          if ($revLaunch.power_levels_checked -ne 3 -or -not $revLaunch.handbrake_neutral_parity -or -not $revLaunch.stronger_power_more_spin -or $revLaunch.controlled_initial_slip_m -ne 0) { throw 'Rev-release launch spin failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\power-wheelie.json" validation/power-wheelie.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\power-wheelie.csv" validation/power-wheelie.csv
          $powerWheelie = Get-Content validation/power-wheelie.json -Raw | ConvertFrom-Json
          if ($powerWheelie.power_levels_checked -ne 5 -or -not $powerWheelie.same_chassis_and_grip -or -not $powerWheelie.stronger_wheelie_verified) { throw 'Power-dependent wheelie progression failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\handbrake-rev.json" validation/handbrake-rev.json
          $handbrake = Get-Content validation/handbrake-rev.json -Raw | ConvertFrom-Json
          if ($handbrake.drivetrains_checked -ne 3 -or -not $handbrake.free_rev_without_drive -or -not $handbrake.safe_reengagement) { throw 'Handbrake free rev or clutch reconnection failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\wheel-carriers.json" validation/wheel-carriers.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\wheelie-tuning.csv" validation/wheelie-tuning.csv
          $carriers = Get-Content validation/wheel-carriers.json -Raw | ConvertFrom-Json
          if ($carriers.hub_cases_checked -ne 9168 -or -not $carriers.suspension_axes_respected -or -not $carriers.mechanical_travel_respected -or $carriers.wheelie_endpoint_lift_m -lt 0.1 -or $carriers.balanced_endpoint_lift_m -ne 0 -or $carriers.full_android_dynamics_equivalence) { throw 'Wheel attachment or progressive wheelie tuning differs' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\wheelie-bars.json" validation/wheelie-bars.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\wheelie-bars.csv" validation/wheelie-bars.csv
          $bars = Get-Content validation/wheelie-bars.json -Raw | ConvertFrom-Json
          if ($bars.source_bodies_checked -ne 382 -or -not $bars.contact_plane_respected -or $bars.reference_barred_lift_m -gt 0.01 -or $bars.original_bar_physics_recovered) { throw 'Wheelie bar ground-contact check failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\drag-setup.json" validation/drag-setup.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\drag-launch.csv" validation/drag-launch.csv
          $drag = Get-Content validation/drag-setup.json -Raw | ConvertFrom-Json
          if ($drag.launch_cases_checked -ne 6 -or -not $drag.drag_keeps_contact -or $drag.max_drag_pitch_rad -ge 0.04 -or $drag.original_physics_imported) { throw 'Drag contact or physics provenance check failed' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\suspension-aids.json" validation/suspension-aids.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\suspension-physics.csv" validation/suspension-physics.csv
          $chassis = Get-Content validation/suspension-aids.json -Raw | ConvertFrom-Json
          if ($chassis.chassis_configurations_checked -ne 64 -or $chassis.max_wheelie_lift_m -lt 0.1 -or $chassis.abs_stop_m -ge $chassis.locked_stop_m -or $chassis.tc_launch_distance_m -le $chassis.uncontrolled_launch_distance_m -or $chassis.full_android_dynamics_equivalence) { throw 'Suspension or driving-aid coverage differs' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\burnout-neutral.json" validation/burnout-neutral.json
          $burnout = Get-Content validation/burnout-neutral.json -Raw | ConvertFrom-Json
          if ($burnout.burnout_layouts_checked -ne 3 -or $burnout.special_smoke_colours -ne 8 -or !$burnout.neutral_behaviour_checked) { throw 'Burnout or neutral regression coverage differs' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\stock-vehicle-physics.json" validation/stock-vehicle-physics.json
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\stock-vehicle-physics.csv" validation/stock-vehicle-physics.csv
          $stock = Get-Content validation/stock-vehicle-physics.json -Raw | ConvertFrom-Json
          if ($stock.bodies_checked -ne 191 -or $stock.fwd -ne 33 -or $stock.rwd -ne 126 -or $stock.awd -ne 32 -or $stock.full_android_dynamics_equivalence) { throw 'Per-car source physics coverage differs' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\exhaust-source-rules.json" validation/exhaust-source-rules.json
          $sourcePipes = Get-Content validation/exhaust-source-rules.json -Raw | ConvertFrom-Json
          if ($sourcePipes.source_transforms_checked -ne 18336 -or !$sourcePipes.hood_remains_native) { throw 'Source exhaust regression coverage differs' }
          $fitting = Get-Content validation/attachment-fit.json -Raw | ConvertFrom-Json
          if ($fitting.source_body_pipe_configurations -ne 18718 -or $fitting.fitted_variants_checked -ne 243334 -or $fitting.recovered_coordinates -ne 4584) { throw 'Source attachment coverage differs' }
          $geometry = Get-Content validation/exhaust-gearbox.json -Raw | ConvertFrom-Json
          if ($geometry.body_pipe_configurations -ne 9359 -or $geometry.gearbox_presets -ne 8 -or $geometry.maximum_gears -ne 10) { throw 'Exhaust or gearbox coverage differs' }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\pc-turbos.csv" validation/pc-turbos.csv
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\pc-engines.csv" validation/pc-engines.csv
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\nfs-engines.csv" validation/nfs-engines.csv
          $nfs = Import-Csv validation/nfs-engines.csv
          if ($nfs.Count -ne 145) { throw 'Expected all 145 spreadsheet engines' }
          foreach ($engine in $nfs) {
            if ([Math]::Abs([double]$engine.stock_hp - [double]$engine.measured_stock_hp) -gt 0.02 -or [Math]::Abs([double]$engine.potential_hp - [double]$engine.measured_elite_hp) -gt 0.02) { throw 'Spreadsheet engine power differs' }
          }
          Copy-Item "$env:RUNNER_TEMP\pcr-native-core\power-combinations.json" validation/power-combinations.json
          $power = Get-Content validation/power-combinations.json -Raw | ConvertFrom-Json
          if ($power.induction_combinations -ne 175770 -or $power.atmospheric_combinations -ne 332816 -or $power.max_without_nos_hp -lt 4200 -or $power.max_with_nos_hp -lt 4500 -or $power.original_game_equivalence_validated) { throw 'Compound power or combination coverage failed' }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\pcr-native-app"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version | Format-List | Out-File validation/windows.txt
      - name: Run and compare native physics measurements on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\pcr-native-app\PixelCarRacerNative.exe"
          $out = Join-Path $PWD 'validation/physics'
          $p = Start-Process $exe -ArgumentList "--physics-benchmark-dir `"$out`"" -Wait -PassThru -RedirectStandardOutput validation/physics-stdout.txt -RedirectStandardError validation/physics-stderr.txt
          if ($p.ExitCode -ne 0) { throw 'Native Windows physics benchmark failed' }
          $report = Get-Content "$out/physics-report.json" -Raw | ConvertFrom-Json
          $baseline = Get-Content "$env:RUNNER_TEMP\pcr-native-app\native-physics-baseline.json" -Raw | ConvertFrom-Json
          if (!$report.sanity_checks_passed -or $report.original_game_equivalence_validated) { throw 'Invalid physics status' }
          if ($report.schema -ne 1 -or $report.model -ne $baseline.model) { throw 'Unexpected physics model' }
          foreach ($metric in $baseline.measurements.PSObject.Properties) {
            $actual = [double]$report.measurements.($metric.Name)
            $expected = [double]$metric.Value
            if (![double]::IsFinite($actual) -or [math]::Abs($actual - $expected) -gt 0.01) { throw "Physics metric differs between Linux and Windows: $($metric.Name)" }
          }
          'PASS: all native-model metrics agree within 0.01 in their SI/time or km/h units. This does not validate Android equivalence.' | Out-File validation/physics-comparison.txt
      - name: Decode all original audio samples on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\pcr-native-app\PixelCarRacerNative.exe"
          $out = Join-Path $PWD 'validation/audio'
          $p = Start-Process $exe -ArgumentList "--check-audio-dir `"$out`"" -Wait -PassThru -RedirectStandardOutput validation/audio-stdout.txt -RedirectStandardError validation/audio-stderr.txt
          if ($p.ExitCode -ne 0) { throw 'Original audio decoder validation failed' }
          $report = Get-Content "$out/audio-report.txt"
          if (($report | Select-String '^PASS [^:]').Count -ne 282 -or ($report | Select-String '^FAIL ')) { throw 'Expected 282 valid Original, Unbound and Underground sound associations' }
          $engineLoops = Get-Content "$out/engine-loop-report.json" -Raw | ConvertFrom-Json
          if ($engineLoops.engine_bank_cases -ne 36 -or $engineLoops.source_files_modified) { throw 'Engine loop coverage failed' }
          foreach ($loop in $engineLoops.loops) { if ($loop.seam_after -gt $loop.seam_before + 0.00001 -or $loop.peak_after -gt $loop.peak_before + 0.00001) { throw 'Engine loop seam or peak worsened' } }
          Copy-Item "$out/engine-loop-report.json" validation/engine-loop-report.json
          $simulation = Get-Content "$out/simulated-audio-report.txt"
          if (($simulation | Where-Object { $_ -like 'PASS *' -and $_ -notlike 'PASS:*' }).Count -ne 358) { throw 'Simulated audio decode coverage differs' }
          $menuMusic=Get-Content "$out/menu-music-report.json" -Raw | ConvertFrom-Json
          if ($menuMusic.clips_checked -ne 2 -or !$menuMusic.no_clipping -or !$menuMusic.same_timeline) { throw 'Supplied menu music decoder check failed' }
          foreach ($clip in $menuMusic.clips) { if ($clip.channels -ne 2 -or $clip.sample_rate -ne 44100 -or $clip.peak -ge .99) { throw 'Invalid menu song format or clipping' } }
          Copy-Item "$out/menu-music-report.json" validation/menu-music-report.json

          Copy-Item "$out/simulated-audio-report.txt" validation/simulated-audio-report.txt
          Get-Content "$out/audio-report.txt"
      - name: Prepare verified software OpenGL for the CI runner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mesa = "$env:RUNNER_TEMP\mesa.7z"
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $mesa
          if ((Get-FileHash $mesa -Algorithm SHA256).Hash.ToLower() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'Mesa digest mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x $mesa "-o$env:RUNNER_TEMP\mesa" -y | Out-File validation/mesa-extraction.txt
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $opengl = Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (!$opengl) { throw 'Mesa x64 OpenGL not found' }
          Copy-Item "$($opengl.DirectoryName)\*.dll" "$env:RUNNER_TEMP\pcr-native-app\"
          'Test-only Mesa 26.2.4, SHA256 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695. These DLLs are not distributed in the game.' | Out-File validation/renderer.txt
      - name: Run the actual native Windows application
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\pcr-native-app\PixelCarRacerNative.exe"
          $data = "$env:RUNNER_TEMP\pcr-native-smoke"
          $captures = Join-Path $PWD 'validation/screens'
          $arguments = "--data-dir `"$data`" --capture-dir `"$captures`" --no-audio --smoke-test"
          $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput validation/application-stdout.txt -RedirectStandardError validation/application-stderr.txt
          if (Test-Path "$data\smoke-report.txt") { Copy-Item "$data\smoke-report.txt" validation/; Get-Content validation/smoke-report.txt }
          if ($p.ExitCode -ne 0) { throw "Native Windows application failed: $($p.ExitCode)" }
          if (!(Test-Path validation/smoke-report.txt)) { throw 'Missing graphical validation report' }
          if (Select-String -Path validation/smoke-report.txt -Pattern '^FAIL ') { throw 'Graphical check failed' }
          Copy-Item "$data\settings.ini" validation/
          Copy-Item "$data\profile.ini" validation/
          "Archive SHA256: $env:EXPECTED_SHA`nCore test SHA256: $env:CORE_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Out-File validation/provenance.txt
      - name: Verify rendered speed and stationary wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $screens = Join-Path $PWD 'validation/screens'
          $a = (Get-FileHash "$screens/motion-stationary-a.png" -Algorithm SHA256).Hash
          $b = (Get-FileHash "$screens/motion-stationary-b.png" -Algorithm SHA256).Hash
          if ($a -ne $b) { throw 'Stationary scene or wheels moved' }
          'PASS stationary scene and wheels remain frozen' | Out-File validation/motion-report.txt
          $a = (Get-FileHash "$screens/motion-paused-a.png" -Algorithm SHA256).Hash
          $b = (Get-FileHash "$screens/motion-paused-b.png" -Algorithm SHA256).Hash
          if ($a -ne $b) { throw 'Paused scene or wheels moved at nonzero speed' }
          'PASS paused scene and wheels remain frozen at nonzero speed' | Out-File validation/motion-report.txt -Append
          foreach ($speed in @(100,200)) {
            $first = [System.Drawing.Bitmap]::new("$screens/motion-$speed-a.png")
            $second = [System.Drawing.Bitmap]::new("$screens/motion-$speed-b.png")
            try {
              $row = [int][math]::Round(517 * $first.Height / 720)
              $shift = [int][math]::Round($speed / 3.6 * 0.1 * 48 * $first.Width / 1280)
              $matches = 0; $lit = 0; $changed = 0
              for ($x=0; $x -lt ($first.Width-$shift); $x++) {
                $left = $first.GetPixel($x+$shift,$row)
                $right = $second.GetPixel($x,$row)
                $original = $first.GetPixel($x,$row)
                $before = $left.R -eq 171 -and $left.G -eq 173 -and $left.B -eq 181
                $after = $right.R -eq 171 -and $right.G -eq 173 -and $right.B -eq 181
                if ($before -eq $after) { $matches++ }
                if ($after) { $lit++ }
                if ($original.ToArgb() -ne $right.ToArgb()) { $changed++ }
              }
              if ($lit -eq 0 -or $changed -eq 0 -or $matches / ($first.Width-$shift) -lt 0.98) { throw "Rendered road displacement differs at $speed km/h" }
              "PASS road at $speed km/h moves $shift image pixels in 0.1 seconds" | Out-File validation/motion-report.txt -Append
            } finally { $first.Dispose(); $second.Dispose() }
          }
      - name: Verify visible NOS and backfire rendering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::new((Join-Path $PWD 'validation/screens/echappement-arriere.png'))
          try {
            $blue = 0; $warm = 0
            for ($y=[int][math]::Round(300*$image.Height/720); $y -lt [int][math]::Round(500*$image.Height/720); $y++) {
              for ($x=[int][math]::Round(300*$image.Width/1280); $x -lt [int][math]::Round(410*$image.Width/1280); $x++) {
                $p = $image.GetPixel($x,$y)
                if ($p.R -gt 50 -and $p.G -gt ($p.R+30) -and $p.B -gt ($p.R+50)) { $blue++ }
                if ($p.R -gt 150 -and $p.G -gt 60 -and $p.B -lt ($p.R-70)) { $warm++ }
              }
            }
            if ($blue -lt 5 -or $warm -lt 5) { throw "Exhaust effects not visibly rendered: blue=$blue warm=$warm" }
            "PASS visible NOS and backfire pixels: blue=$blue warm=$warm" | Out-File validation/exhaust-pixels.txt
          } finally { $image.Dispose() }
      - name: Verify all eight burnout smoke colours in Windows captures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $colours = @(@('green',90,150),@('teal',155,195),@('purple',255,295),@('pink',305,345),@('red',345,20),@('orange',20,45),@('yellow',45,75),@('blue',200,245))
          $result = [ordered]@{}
          for ($i=0; $i -lt 8; $i++) {
            $file = Join-Path $PWD ('validation/screens/burnout-{0:00}.png' -f ($i+9))
            $image = [System.Drawing.Bitmap]::new($file)
            try {
              $count=0; $low=[double]($colours[$i][1]); $high=[double]($colours[$i][2])
              for ($y=[int][math]::Round(370*$image.Height/720); $y -lt [int][math]::Round(475*$image.Height/720); $y++) {
                for ($x=[int][math]::Round(375*$image.Width/1280); $x -lt [int][math]::Round(470*$image.Width/1280); $x++) {
                  $pixel=$image.GetPixel($x,$y); $hue=$pixel.GetHue()
                  $inside=if ($low -le $high) { $hue -ge $low -and $hue -le $high } else { $hue -ge $low -or $hue -le $high }
                  if ($inside -and $pixel.GetSaturation() -gt 0.3 -and [math]::Max($pixel.R,[math]::Max($pixel.G,$pixel.B)) -gt 30) { $count++ }
                }
              }
              if ($count -lt 80) { throw "Missing burnout smoke colour: $($colours[$i][0])" }
              $result[$colours[$i][0]]=$count
            } finally { $image.Dispose() }
          }
          $result | ConvertTo-Json | Out-File validation/burnout-pixels.json
      - name: Verify twelve paint previews use distinct body textures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::new((Join-Path $PWD 'validation/screens/materiaux-source.png'))
          try {
            $hashes = @()
            for ($i=0; $i -lt 12; $i++) {
              $x=8+424*($i % 3)+5; $y=60+164*[math]::Floor($i/3)+28
              $rect = [System.Drawing.Rectangle]::FromLTRB([int][math]::Round($x*$image.Width/1280),[int][math]::Round($y*$image.Height/720),[int][math]::Round(($x+400)*$image.Width/1280),[int][math]::Round(($y+125)*$image.Height/720))
              $crop=$image.Clone($rect,$image.PixelFormat); $stream=[System.IO.MemoryStream]::new()
              try {
                $crop.Save($stream,[System.Drawing.Imaging.ImageFormat]::Png)
                $hashes += [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($stream.ToArray()))
              } finally { $crop.Dispose(); $stream.Dispose() }
            }
            if (($hashes | Select-Object -Unique).Count -ne 12) { throw 'Paint previews reused a body texture' }
            @{ distinct_body_previews=12; crop_sha256=$hashes } | ConvertTo-Json | Out-File validation/customization-pixels.json
          } finally { $image.Dispose() }
      - name: Verify cinematic showroom and custom carousels on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          function Count-Blue($image,$box) {
            $count=0
            for ($y=[int][math]::Round($box[1]*$image.Height/720); $y -lt [int][math]::Round($box[3]*$image.Height/720); $y++) {
              for ($x=[int][math]::Round($box[0]*$image.Width/1280); $x -lt [int][math]::Round($box[2]*$image.Width/1280); $x++) {
                $c=$image.GetPixel($x,$y); if ($c.B -gt 75 -and $c.B -gt $c.R*1.4 -and $c.B -gt $c.G*1.15) { $count++ }
              }
            }
            return $count
          }
          $names=@('showroom-preview-civic.png','showroom-preview-corvette.png','garage-vide.png','garage-huit-places.png','custom-carrousel-moteur.png')
          $images=@($names | ForEach-Object { [System.Drawing.Bitmap]::new((Join-Path $PWD "validation/screens/$_")) })
          try {
            $blue=@(Count-Blue $images[0] @(24,210,940,471); Count-Blue $images[1] @(24,210,940,471); Count-Blue $images[2] @(24,210,940,471))
            $right=Count-Blue $images[1] @(956,120,1248,465)
            $carousel=Count-Blue $images[3] @(38,556,1240,623)
            $custom=Count-Blue $images[4] @(24,210,940,471)
            $w=$images[0].Width; $h=$images[0].Height; $changed=0
            for ($y=[int][math]::Round(210*$h/720); $y -lt [int][math]::Round(471*$h/720); $y++) {
              for ($x=[int][math]::Round(24*$w/1280); $x -lt [int][math]::Round(940*$w/1280); $x++) {
                $a=$images[0].GetPixel($x,$y); $b=$images[1].GetPixel($x,$y)
                if ([math]::Abs([int]$a.R-[int]$b.R) -gt 12 -or [math]::Abs([int]$a.G-[int]$b.G) -gt 12 -or [math]::Abs([int]$a.B-[int]$b.B) -gt 12) { $changed++ }
              }
            }
            $hashes=@()
            for ($i=0; $i -lt 6; $i++) {
              $rect=[System.Drawing.Rectangle]::FromLTRB([int][math]::Round((38+$i*202+18)*$w/1280),[int][math]::Round(558*$h/720),[int][math]::Round((38+$i*202+176)*$w/1280),[int][math]::Round(618*$h/720))
              $crop=$images[3].Clone($rect,$images[3].PixelFormat); $stream=[System.IO.MemoryStream]::new()
              try { $crop.Save($stream,[System.Drawing.Imaging.ImageFormat]::Png); $hashes += [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($stream.ToArray())) } finally { $crop.Dispose(); $stream.Dispose() }
            }
            if ($blue[0] -le 2500 -or $blue[1] -le 2500 -or $blue[2] -ge 50 -or $right -ge 100 -or $changed -le 1000 -or $carousel -le 500 -or $custom -le 2500 -or ($hashes | Select-Object -Unique).Count -ne 6) { throw "Cinematic carousel rendering failed: cars=$blue right=$right carousel=$carousel custom=$custom" }
            $expected=@{
              'custom-accueil.png'=@('8','0','4','0'); 'custom-menu-style.png'=@('8','1','5','1');
              'custom-menu-carrosserie.png'=@('8','2','3','2'); 'custom-menu-elements.png'=@('8','3','10','3');
              'custom-menu-peinture.png'=@('8','4','2','2'); 'custom-menu-performance.png'=@('8','7','5','1')
            }
            foreach ($name in $expected.Keys) {
              $state=Get-Content "validation/screens/$name.state" -Raw | ConvertFrom-StringData
              $e=$expected[$name]
              if ($state.screen -ne $e[0] -or $state.rides_page -ne $e[1] -or $state.entry_count -ne $e[2] -or $state.rides_depth -ne $e[3]) { throw "Wrong rides navigation capture: $name" }
            }
            $stance=Get-Content 'validation/screens/custom-posture.png.state' -Raw | ConvertFrom-StringData
            if ($stance.screen -ne '9' -or $stance.ride_height_mm -eq $stance.draft_ride_height_mm) { throw 'Stance preview must remain a draft' }
            $photo=Get-Content 'validation/screens/custom-photo.png.state' -Raw | ConvertFrom-StringData
            if ($photo.hide_ui -ne '1') { throw 'Photo view did not hide navigation' }
            @{ hierarchy_screens_checked=6; stance_draft_checked=$true; photo_mode_checked=$true } | ConvertTo-Json | Out-File validation/rides-navigation.json
            @{ large_car_pixels=$blue; distinct_car_pixels=$changed; right_stats_blue_pixels=$right; bottom_carousel_pixels=$carousel; custom_car_pixels=$custom; distinct_thumbnail_hashes=$hashes } | ConvertTo-Json | Out-File validation/showroom-pixels.json
          } finally { $images | ForEach-Object { $_.Dispose() } }
      - name: Verify rear exhaust stays behind near wheels
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $image=[System.Drawing.Bitmap]::new((Join-Path $PWD 'validation/screens/exhaust-wheel-occlusion.png'))
          try {
            $rows=Get-Content 'validation/screens/exhaust-wheel-occlusion.json' -Raw | ConvertFrom-Json
            $results=@(); $visible=0
            foreach ($row in $rows) {
              $cx=$row.left_x*$image.Width/1280; $cy=$row.y*$image.Height/720
              $rx=$row.radius*$image.Width/1280; $ry=$row.radius*$image.Height/720
              $offset=[int][math]::Round(($row.right_x-$row.left_x)*$image.Width/1280); $diff=0; $total=0
              for ($y=[int][math]::Floor($cy-$ry); $y -le [int][math]::Ceiling($cy+$ry); $y++) {
                for ($x=[int][math]::Floor($cx-$rx); $x -le [int][math]::Ceiling($cx+$rx); $x++) {
                  if ([math]::Pow(($x+.5-$cx)/$rx,2)+[math]::Pow(($y+.5-$cy)/$ry,2) -le 1) {
                    $a=$image.GetPixel($x,$y); $b=$image.GetPixel($x+$offset,$y); $total++
                    if ([math]::Abs([int]$a.R-[int]$b.R) -gt 3 -or [math]::Abs([int]$a.G-[int]$b.G) -gt 3 -or [math]::Abs([int]$a.B-[int]$b.B) -gt 3) { $diff++ }
                  }
                }
              }
              if ($diff -ne 0) { throw "Rear exhaust obscures wheel in case $($row.row): $diff pixels" }
              for ($y=[int][math]::Round((70+$row.row*156)*$image.Height/720); $y -lt [int][math]::Round((205+$row.row*156)*$image.Height/720); $y++) {
                for ($x=[int][math]::Round(60*$image.Width/1280); $x -lt [int][math]::Round(480*$image.Width/1280); $x++) {
                  $a=$image.GetPixel($x,$y); $b=$image.GetPixel($x+[int][math]::Round(640*$image.Width/1280),$y)
                  if ([math]::Abs([int]$a.R-[int]$b.R) -gt 12 -or [math]::Abs([int]$a.G-[int]$b.G) -gt 12 -or [math]::Abs([int]$a.B-[int]$b.B) -gt 12) { $visible++ }
                }
              }
              $results+=@{row=$row.row;wheel_pixels=$total;changed_wheel_pixels=$diff}
            }
            if ($results.Count -ne 4 -or $visible -le 4) { throw 'Missing rear exhaust or wheel cases' }
            @{cases=$results;visible_exhaust_pixels=$visible} | ConvertTo-Json -Depth 4 | Out-File validation/exhaust-wheel-pixels.json
          } finally { $image.Dispose() }
      - name: Verify Underground customization identity and complete body sheets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = @{}
          Get-Content validation/screens/custom-underground.png.state | ForEach-Object { $kv = $_ -split '=',2; if ($kv.Length -eq 2) { $state[$kv[0]]=$kv[1] } }
          if ($state['vehicle_id'] -ne 'pcr-underground-007' -or $state['screen'] -ne '8') { throw 'Underground customization resolves to the wrong source' }
          Add-Type -AssemblyName System.Drawing
          $cells=0
          for ($page=0; $page -lt 4; $page++) {
            $im=[System.Drawing.Bitmap]::new((Join-Path $PWD "validation/screens/underground-voitures-$($page+1).png"))
            try {
              for ($j=0; $j -lt 48; $j++) {
                if ($page*48+$j -ge 191) { break }
                $left=($j%6)*213; $top=[math]::Floor($j/6)*89; $blue=0
                for ($y=[int](($top+19)*$im.Height/720); $y -lt [int](($top+87)*$im.Height/720); $y+=2) {
                  for ($x=[int](($left+2)*$im.Width/1280); $x -lt [int](($left+211)*$im.Width/1280); $x+=2) {
                    $c=$im.GetPixel($x,$y); if ($c.B -gt 65 -and $c.B -gt $c.R*1.35 -and $c.B -gt $c.G*1.1) { $blue++ }
                  }
                }
                if ($blue -lt 2) { throw "Missing Underground body $($page*48+$j)" }; $cells++
              }
            } finally { $im.Dispose() }
          }
          if ($cells -ne 191) { throw 'Incomplete Underground body coverage' }
          @{visible_body_cells=$cells;identity=$state['vehicle_id']} | ConvertTo-Json | Out-File validation/underground-pixels.json
      - name: Verify scoped editors, single provenance and six rim styles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine=Get-Content validation/screens/moteur-menu-isole.png.state -Raw | ConvertFrom-StringData
          if ($engine.scoped_editor -ne '1' -or $engine.editor_group -ne '0' -or $engine.tab_count -ne '2') { throw 'Engine leaf exposes another category' }
          foreach ($origin in @('original','unbound','underground')) {
            $state=Get-Content "validation/screens/provenance-$origin.png.state" -Raw | ConvertFrom-StringData
            if ($state.preview_origin -ne $origin.ToUpperInvariant()) { throw "Wrong single origin: $origin" }
          }
          $total=0; $styles=@('offroad','tuner','muscle','drag','luxury','hyper'); $results=@{}
          for ($i=0; $i -lt $styles.Count; $i++) {
            $name=$styles[$i]
            $state=Get-Content "validation/screens/jantes-style-$name.png.state" -Raw | ConvertFrom-StringData
            $count=[int]$state.visible_choice_count
            if ($count -lt 1 -or [int]$state.rim_style_filter -ne $i+1 -or $state.scoped_editor -ne '1' -or $state.editor_group -ne '1') { throw "Wrong rim filter: $name" }
            $total+=$count; $results[$name]=$count
          }
          if ($total -ne 530) { throw 'Rim categories omit or duplicate visible choices' }
          @{visible_rims=$total;categories=$results;scoped_engine_tabs=2;single_origin=$true} | ConvertTo-Json -Depth 4 | Out-File validation/catalogue-review-checks.json
      - name: Verify music context routing and driving silence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected=@{'menu.png'='MENU';'garage-huit-places.png'='GARAGE';'custom-accueil.png'='CUSTOMISATION';'mode-libre-final.png'='SILENCE'}
          foreach ($name in $expected.Keys) {
            $state=Get-Content "validation/screens/$name.state" -Raw | ConvertFrom-StringData
            if ($state.menu_music_context -ne $expected[$name]) { throw "Wrong music context in $name" }
