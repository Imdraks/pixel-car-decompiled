          path: Validation-Windows.zip
          retention-days: 14
  publish:
    needs: [assemble,windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-candidate
          path: candidate
